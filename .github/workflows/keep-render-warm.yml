name: Keep Render API warm

# Render's free tier spins the API down after ~15 min idle; the next
# request then pays a 20-30s cold-start penalty. Pinging its health
# endpoint regularly during business hours keeps it warm for real usage
# without running it (and burning free compute-hours) around the clock.
#
# Window: 03:00-16:59 UTC every day = ~07:00-21:00 Gulf Standard Time
# (UTC+4) — adjust the cron hours below if actual usage hours differ.
on:
  schedule:
    - cron: "*/10 3-16 * * *"
  workflow_dispatch: {} # manual "Run workflow" button for on-demand warm-up

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf -o /dev/null -w "status:%{http_code} time:%{time_total}s\n" \
            https://caselogger-api.onrender.com/health --max-time 60 \
            || echo "Ping failed or timed out — likely mid cold-start, not a real failure."
