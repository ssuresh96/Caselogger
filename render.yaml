services:
  - type: web
    name: caselogger-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    envVars:
      # Prompted for in Render's own dashboard during setup — never stored
      # in this repo. Paste the real Atlas connection string there.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: case_logger
      # Render generates a fresh random value on deploy — not the dev secret.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_LIFETIME_SECONDS
        value: "43200"
      # sync: false — managed directly in Render's dashboard/API, not here.
      # A hardcoded value here was getting silently re-applied on every
      # deploy (Blueprint sync re-asserts synced env vars from this file),
      # wiping out the real Vercel URL each time it was set via the API.
      - key: CORS_ORIGINS
        sync: false
      # Email-to-case agent — all secrets, all managed directly in Render's
      # dashboard/API, same rationale as MONGODB_URI/CORS_ORIGINS above.
      # Feature stays inert (see app/email_agent/service.py's
      # is_configured()) until every one of these is actually set.
      # Microsoft Graph credentials are NOT here — an admin enters those
      # from the app itself (Admin > Email Agent), stored in Mongo.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_AGENT_INTERNAL_TOKEN
        sync: false
      - key: EMAIL_AGENT_SERVICE_USER_EMAIL
        sync: false
